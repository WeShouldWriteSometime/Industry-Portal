RING.hidden=false;

RING.style.width=(r.width+12)+'px';RING.style.height=(r.height+12)+'px';

if(r.left-g-cw>12){ left=r.left-g-cw; side='r'; }

else { left=Math.max(12,Math.min(vw-cw-12,r.left+r.width/2-cw/2)); side='c'; }

CARD.innerHTML='<div class="gd-eb">'+(c.eyebrow||'')+'</div><div class="gd-t">'+c.title+'</div>'+

CARD.querySelector('.gd-ok').onclick=shut;
CARD.querySelector('.gd-off').onclick=function(){ setOff(true); Q.length=0; shut(); paint(); };

requestAnimationFrame(function(){ if(curT===el) place(el); });
}
function paint(){

paint();
};
paint();
}
return {fire:fire,mount:mount,shut:shut,isOff:isOff};

function norm(t){ return t.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }

function findNames(t){
var q=norm(t), out=[], used=[];
var cands=N.map(function(n){ return {n:n, k:norm(n.id)}; })
.sort(function(a,b){ return b.k.length-a.k.length; });
cands.forEach(function(c){
if(c.k.length<3) return;
var i=q.indexOf(c.k);
if(i<0) return;
for(var u=0;u<used.length;u++) if(i<used[u][1] && i+c.k.length>used[u][0]) return;
used.push([i,i+c.k.length]); out.push({n:c.n, at:i});
});
if(!out.length){
var w=q.split(' ');
N.filter(function(n){return n.t===2;}).forEach(function(n){
var f=norm(n.id.split(' ')[0]);
if(w.indexOf(f)>=0 && !out.some(function(o){return o.n===n;})) out.push({n:n, at:q.indexOf(f)});
});
}
return out.sort(function(a,b){return a.at-b.at;}).map(function(o){return o.n;});
}

var sgs=songsBetween(ppl[0],ppl[1]);

'<span class="sw-do" onclick="swTrace(\''+esc(ppl[0].id)+'\',\''+esc(ppl[1].id)+'\')">Show the line \u203a</span>';

return qPath(ppl[0],ppl[1]);

'Name somebody and I\u2019ll pull it up. Try <em>\u201chow does Cole Taylor connect to Jelly Roll\u201d</em>.';
}
